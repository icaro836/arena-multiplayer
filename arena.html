<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Arena Multiplayer</title>
  <link rel="manifest" href="arena-manifest.json">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #fff;
    }

    .game {
      width: min(92vw, 480px);
      min-height: 560px;
      padding: 24px;
      border: 2px solid #374151;
      border-radius: 16px;
      background: #1f2937;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 8px 0 24px;
      font-size: clamp(24px, 8vw, 38px);
    }

    p {
      line-height: 1.5;
    }

    input {
      width: 100%;
      min-height: 52px;
      margin: 8px 0;
      padding: 12px;
      border: 1px solid #6b7280;
      border-radius: 9px;
      background: #111827;
      color: #fff;
      font-size: 17px;
      text-align: center;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .stat {
      padding: 14px 8px;
      border-radius: 8px;
      background: #374151;
    }

    .message {
      min-height: 64px;
      margin: 18px 0;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 56px;
      margin: 6px 0;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: #4b5563;
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .room-code {
      margin: 14px 0;
      padding: 12px;
      border: 1px dashed #93c5fd;
      border-radius: 8px;
      color: #bfdbfe;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    .error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>ARENA MULTIPLAYER</h1>
    <div id="screen"></div>
  </main>

  <script>
    const screen = document.getElementById("screen");
    const savedSession = localStorage.getItem("arenaSession");
    let session = savedSession ? JSON.parse(savedSession) : null;
    let pollTimer = null;
    let polling = false;
    let latestState = null;
    let notice = "";

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[character]);
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...options.headers }
      });
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.error || "Não foi possível completar a operação.");
      }
      return result;
    }

    function renderLobby(error = "") {
      clearInterval(pollTimer);
      screen.innerHTML = `
        <p>Crie uma sala e compartilhe o código com outra pessoa.</p>
        <input id="name" maxlength="18" placeholder="Seu nome" autocomplete="nickname">
        <button id="create">Criar sala</button>
        <p>ou entre em uma sala existente:</p>
        <input id="roomCode" maxlength="6" placeholder="Código da sala" autocomplete="off">
        <button class="secondary" id="join">Entrar na sala</button>
        <p class="error" id="error">${escapeHTML(error)}</p>
      `;
      document.getElementById("create").addEventListener("click", createRoom);
      document.getElementById("join").addEventListener("click", joinRoom);
    }

    function readName() {
      const name = document.getElementById("name").value.trim();
      if (!name) {
        throw new Error("Digite seu nome primeiro.");
      }
      return name;
    }

    async function createRoom() {
      try {
        const result = await request("/api/rooms", {
          method: "POST",
          body: JSON.stringify({ name: readName() })
        });
        enterRoom(result);
      } catch (error) {
        renderLobby(error.message);
      }
    }

    async function joinRoom() {
      try {
        const name = readName();
        const code = document.getElementById("roomCode").value.trim().toUpperCase();
        const result = await request(`/api/rooms/${encodeURIComponent(code)}/join`, {
          method: "POST",
          body: JSON.stringify({ name })
        });
        enterRoom(result);
      } catch (error) {
        renderLobby(error.message);
      }
    }

    function enterRoom(result) {
      session = result.session;
      localStorage.setItem("arenaSession", JSON.stringify(session));
      latestState = result.state;
      notice = "";
      renderRoom();
      pollTimer = setInterval(updateRoom, 1000);
    }

    async function updateRoom() {
      if (!session || polling) return;
      polling = true;
      try {
        latestState = await request(
          `/api/rooms/${encodeURIComponent(session.code)}?playerId=${encodeURIComponent(session.playerId)}`
        );
        notice = "";
        renderRoom();
      } catch (error) {
        notice = error.message;
        if (/sala|jogador|partida/i.test(error.message)) {
          leaveLocalRoom();
        } else {
          renderRoom();
        }
      } finally {
        polling = false;
      }
    }

    function playerCard(player) {
      return `<div class="stat">${escapeHTML(player.name)}<br><strong>Vida: ${player.life}</strong></div>`;
    }

    function renderRoom() {
      if (!session || !latestState) {
        renderLobby();
        return;
      }

      const state = latestState;
      const opponent = state.players.find((player) => player.id !== session.playerId);
      const me = state.players.find((player) => player.id === session.playerId);
      if (!me) {
        leaveLocalRoom();
        return;
      }

      if (state.status === "waiting") {
        screen.innerHTML = `
          <p>Compartilhe este código com seu adversário:</p>
          <div class="room-code">${escapeHTML(state.code)}</div>
          <p>Aguardando outro jogador...</p>
          <button class="secondary" id="exit">Sair da sala</button>
          <p class="error">${escapeHTML(notice)}</p>
        `;
        document.getElementById("exit").addEventListener("click", leaveRoom);
        return;
      }

      if (state.status === "finished") {
        const outcome = state.winnerId === session.playerId
          ? "Você venceu!"
          : state.winnerId
            ? "Você perdeu!"
            : "Empate!";
        screen.innerHTML = `
          <div class="room-code">${escapeHTML(state.code)}</div>
          <h2>${outcome}</h2>
          <p>${escapeHTML(state.report || "A partida terminou.")}</p>
          <div class="stats">${state.players.map(playerCard).join("")}</div>
          <button id="back">Voltar ao início</button>
        `;
        document.getElementById("back").addEventListener("click", leaveRoom);
        return;
      }

      const hasActed = state.submitted.includes(session.playerId);
      const opponentReady = opponent && state.submitted.includes(opponent.id);
      const report = state.report ? `<p>${escapeHTML(state.report)}</p>` : "";
      screen.innerHTML = `
        <div class="room-code">Sala ${escapeHTML(state.code)} · Rodada ${state.round}</div>
        <div class="stats">
          ${playerCard(me)}
          ${opponent ? playerCard(opponent) : '<div class="stat">Aguardando adversário</div>'}
        </div>
        ${report}
        <p class="message">${
          hasActed
            ? (opponentReady ? "Preparando a rodada..." : "Ação enviada. Aguardando o adversário...")
            : "Escolha sua ação para esta rodada."
        }</p>
        <div class="actions">
          <button data-action="attack" ${hasActed ? "disabled" : ""}>Atacar</button>
          <button data-action="defend" ${hasActed ? "disabled" : ""}>Defender</button>
          <button data-action="heal" ${hasActed ? "disabled" : ""}>Curar</button>
          <button class="secondary" id="exit">Desistir</button>
        </div>
        <p class="error">${escapeHTML(notice)}</p>
      `;
      screen.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => submitAction(button.dataset.action));
      });
      document.getElementById("exit").addEventListener("click", leaveRoom);
    }

    async function submitAction(action) {
      try {
        latestState = await request(`/api/rooms/${encodeURIComponent(session.code)}/action`, {
          method: "POST",
          body: JSON.stringify({ playerId: session.playerId, action })
        });
        notice = "";
        renderRoom();
      } catch (error) {
        notice = error.message;
        renderRoom();
      }
    }

    async function leaveRoom() {
      if (session) {
        try {
          await request(`/api/rooms/${encodeURIComponent(session.code)}/leave`, {
            method: "POST",
            body: JSON.stringify({ playerId: session.playerId })
          });
        } catch {
          // A sala pode ter expirado; limpar a sessão local ainda permite voltar ao início.
        }
      }
      leaveLocalRoom();
    }

    function leaveLocalRoom() {
      clearInterval(pollTimer);
      localStorage.removeItem("arenaSession");
      session = null;
      latestState = null;
      renderLobby();
    }

    if (session && /^[A-Z0-9]{6}$/.test(session.code) && typeof session.playerId === "string") {
      updateRoom().then(() => {
        if (session) pollTimer = setInterval(updateRoom, 1000);
      });
    } else {
      renderLobby();
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("arena-sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
